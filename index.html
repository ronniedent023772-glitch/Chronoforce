<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link rel="apple-touch-icon" href="images/icon.png">
  <title>스톱워치</title>

  <!-- iOS 웹앱 전체화면 설정 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="스톱워치">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    /* html과 body가 화면 100%를 꽉 채우도록 기본 설정 */
  /* html과 body 설정 */
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      /* ★ 핵심: 아이폰 시스템이 하단 공간을 강제로 막거나 여백을 주는 것을 뚫습니다 ★ */
      height: -webkit-fill-available;
    }

    body {
      /* position: fixed; 와 top, bottom 설정을 지우고 
         뷰포트에 완전히 맡깁니다. */
      position: absolute;
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      display: flex;
      flex-direction: column;
      
      /* 아이폰 전체화면 웹앱(PWA)에서 시스템 여백을 무시하고 강제로 끝까지 그리기 */
      padding: 0 !important; 
    }

    /* 1. 상단 시간 표시 영역 */
    .stopwatch-display {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 5.5rem;
      font-weight: 200;
      letter-spacing: -1px;
      font-variant-numeric: tabular-nums; /* 숫자 폭 균일화 */
      margin-top: 16vh;
    }

    /* 2. 조작 버튼 및 인디케이터 영역 */
    .controls-section {
      width: 100%;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .btn-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 5px;
      margin-top: 30px;
    }

    .circle-btn {
      width: 85px;
      height: 85px;
      border-radius: 50%;
      border: 2px solid transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.05rem;
      font-weight: 400;
      cursor: pointer;
      position: relative;
    }

    /* 랩 / 재설정 버튼 */
    .btn-lap {
      background-color: #1c1c1e;
      color: #8e8e93;
    }
    .btn-lap.active {
      background-color: #262629;
      color: #ffffff;
    }

    /* 시작 / 중단 버튼 */
    .btn-start {
      background-color: #082a11;
      color: #34c759;
    }
    .btn-stop {
      background-color: #330e0e;
      color: #ff453a;
    }

    /* 페이지 인디케이터 점 */
    .pagination-dots {
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: center;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: #8f8f96;
    }
    .dot.active {
      background-color: #ffffff;
    }

    .divider {
      height: 0.5px;
      background-color: #2c2c2e;
      width: 100%;
      margin-top: 12px;
    }

    /* 빈 리스트 공간 */
   /* 빈 리스트 공간 (랩 기록이 쌓이는 곳) */
    .lap-list-area {
      flex: 1.2;
      width: 100%;
      overflow-y: auto; /* 기록이 많아지면 스크롤 가능하게 설정 */
      padding: 0 16px;
      margin-top: 0px;
      padding-bottom: 90px; /* 맨 밑 탭 이미지에 글자가 가려지지 않게 여백 추가 */
    }

    /* 개별 랩 아이템 스타일 (아이폰 스타일) */
    .lap-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 0.5px solid #66666d; /* 아이폰 특유의 얇은 회색 밑줄 */
      font-size: 1rem;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
    }

/* 3. 하단 네비게이션 탭 (추후 이미지로 대체 가능한 영역) */
/* 3. 하단 네비게이션 탭 (추후 이미지로 대체 가능한 영역) */
/* 3. 하단 네비게이션 탭 */
    .tab-bar-container {
      width: 100%;
      position: absolute; /* fixed 대신 absolute를 써서 주소창 뒤로 뚫리게 함 */
      left: 0;
      bottom: 0px;
      padding: 0;
      margin: 0;
      z-index: 9999;
      background-color: transparent;
    }

    /* 하단 탭 이미지 스타일 */
    .tab-image {
      width: 100%;
      height: auto;
      display: block;
      pointer-events: none;
    }
    
    .tab-item {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #8e8e93;
      font-size: 0.65rem;
      gap: 4px;
      pointer-events: none; /* 실제 탭 터치는 투명 핫스팟이 처리 */
    }

    .tab-item.active {
      color: #ff9f0a;
    }

    .tab-icon {
      font-size: 1.3rem;
    }

    /* 비밀 트리거용 투명 버튼 (핫스팟) */
    /* 비밀 트리거용 버튼 (핫스팟) - 위치 확인을 위해 임시로 보이게 설정 */
   /* 비밀 트리거용 버튼 (핫스팟) - 완벽히 투명하게 숨김 */
    .invisible-hotspot {
      position: absolute;
      bottom: 0;
      width: 25%;
      height: 100%; /* 이미지 높이에 맞춰 꽉 참 */
      z-index: 50;
      
      /* ★ 빨간색 배경과 테두리를 지우고 투명하게 만듭니다 ★ */
      background: transparent; 
      border: none;
    }
    
    #hotspot-worldclock { left: 0; }     /* 세계 시계 위치 */

    /* 4. 마술사 전용 비밀 설정 화면 */
    #secret-view {
      display: none;
      position: fixed;
      inset: 0;
      background-color: #121214;
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .secret-title {
      font-size: 1.1rem;
      color: #8e8e93;
      margin-bottom: 20px;
    }

    .secret-input-box {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 2rem;
      margin-bottom: 30px;
    }

    .secret-input {
      width: 90px;
      height: 60px;
      background: #242426;
      border: 1px solid #48484a; /* 기본 테두리 색상 (어둡게) */
      border-radius: 12px;
      color: #fff;
      font-size: 2.2rem;
      text-align: center;
      outline: none;
      font-variant-numeric: tabular-nums;
    }

    /* 선택된 입력칸만 주황색 테두리로 하이라이트 */
    .secret-input.active-input {
      border: 1px solid #ff9f0a;
    }

    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      width: 260px;
    }

    .key-btn {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      background: #2c2c2e;
      color: #fff;
      font-size: 1.8rem;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }
    .key-btn:active {
      background: #48484a;
    }
  </style>
</head>
<body>

  <!-- 스톱워치 메인 화면 -->
  <div class="stopwatch-display" id="time-display">00:00.00</div>

  <div class="controls-section">
    <div class="btn-row">
      <div class="circle-btn btn-lap" id="lap-reset-btn">랩</div>
      <div class="pagination-dots">
        <span class="dot active"></span>
        <span class="dot"></span>
      </div>
      <div class="circle-btn btn-start" id="start-stop-btn">시작</div>
    </div>
    <div class="divider"></div>
  </div>

  <div class="lap-list-area"></div>

  <!-- 하단 네비게이션 탭 -->
  <!-- 하단 네비게이션 영역 (이미지 삽입을 위한 빈 공간 및 트릭 버튼) -->
<!-- 하단 네비게이션 영역 (이미지 삽입을 위한 빈 공간 및 트릭 버튼) -->
  <div class="tab-bar-container">
    <!-- 하단 메뉴 이미지 -->
    <img src="images/IMG_2856.jpg" alt="하단탭" class="tab-image">
    
    <!-- 세계 시계 위치 (트릭: 더블탭 시 비밀창) -->
    <div class="invisible-hotspot" id="hotspot-worldclock"></div>
  </div>

  

  <!-- 비밀 설정 화면 -->
  <!-- 비밀 설정 화면 -->
  <div id="secret-view">
    <div class="secret-title">포스 숫자</div>
    <!-- 원래 div에 있던 onclick을 지웠습니다 -->
    <div class="secret-input-box">
      <span>.</span>
      <!-- ★ input 태그 안쪽으로 onclick="setActiveInput('target')" 이동 ★ -->
      <input type="text" id="target-number-input" class="secret-input active-input" readonly value="24" onclick="setActiveInput('target')">
    </div>

    <div class="secret-title">포스 타이밍</div>
    <!-- 원래 div에 있던 onclick을 지웠습니다 -->
    <div class="secret-input-box">
      <!-- ★ input 태그 안쪽으로 onclick="setActiveInput('delay')" 이동 ★ -->
      <input type="text" id="target-delay-input" class="secret-input" readonly value="0" onclick="setActiveInput('delay')">
    </div>

    <!-- 간편 키패드 시작 부분 (여기는 그대로) -->
    <div class="keypad-grid">
      <div class="key-btn" onclick="inputKey('1')">1</div>
      <div class="key-btn" onclick="inputKey('2')">2</div>
      <div class="key-btn" onclick="inputKey('3')">3</div>
      <div class="key-btn" onclick="inputKey('4')">4</div>
      <div class="key-btn" onclick="inputKey('5')">5</div>
      <div class="key-btn" onclick="inputKey('6')">6</div>
      <div class="key-btn" onclick="inputKey('7')">7</div>
      <div class="key-btn" onclick="inputKey('8')">8</div>
      <div class="key-btn" onclick="inputKey('9')">9</div>
      <div class="key-btn" onclick="clearKey()">C</div>
      <div class="key-btn" onclick="inputKey('0')">0</div>
      <div class="key-btn" onclick="confirmSecret()" style="background:#ff9f0a; color:#000; font-size:1.1rem; font-weight:600;">완료</div>
    </div>
  </div>

 <script>
    // --- 상태 변수 ---
    let isRunning = false;
    let startTime = 0;
    let elapsedTime = 0;
    let timerInterval = null;

    // 기본 강제 숫자 (저장된 값이 있으면 불러옴)
    let forceHundredths = localStorage.getItem('force_target') || "24";
    let forceDelay = parseInt(localStorage.getItem('force_delay') || "0", 10); // ★ 추가


    let stopCount = 0; // ★ 스톱워치를 중단한 횟수 기록
    let currentActiveInput = 'target'; // ★ 현재 선택된 입력칸 (target 또는 delay)
    // ★ 랩(Lap) 관련 변수 추가 ★
    let lapCount = 0;
    let lastLapSplitTime = 0; // 이전 랩까지 누적된 시간
    let activeLapTimeSpan = null; // 현재 실시간으로 돌아가고 있는 랩의 시간 텍스트 부분

    // DOM 참조
    const display = document.getElementById('time-display');
    const startStopBtn = document.getElementById('start-stop-btn');
    const lapResetBtn = document.getElementById('lap-reset-btn');
    const secretView = document.getElementById('secret-view');
    const targetInput = document.getElementById('target-number-input');
    const lapListArea = document.querySelector('.lap-list-area');
  const delayInput = document.getElementById('target-delay-input'); // ★ 추가

    targetInput.value = forceHundredths;
    delayInput.value = forceDelay; // ★ 추가

    // --- 스톱워치 표시 포맷팅 ---
    function formatDisplay(ms, forcedHundredths = null) {
      if (ms < 0) ms = 0; 
      const totalSeconds = Math.floor(ms / 1000);
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;

      let hundredths = forcedHundredths !== null 
        ? forcedHundredths 
        : String(Math.floor((ms % 1000) / 10)).padStart(2, '0');

      const mStr = String(minutes).padStart(2, '0');
      const sStr = String(seconds).padStart(2, '0');

      return `${mStr}:${sStr}.${hundredths}`;
    }

    // ★ 랩 HTML 요소를 생성하고 맨 위에 추가하는 함수 ★
    function createLapElement(lapNum, initialTimeStr) {
      const lapDiv = document.createElement('div');
      lapDiv.className = 'lap-item';
      lapDiv.innerHTML = `
        <span>랩 ${lapNum}</span>
        <span class="lap-time-val">${initialTimeStr}</span>
      `;
      lapListArea.prepend(lapDiv); // 항상 맨 위에 추가
      return lapDiv.querySelector('.lap-time-val'); // 숫자 텍스트 부분만 반환
    }

    // --- 스톱워치 메인 로직 ---
    startStopBtn.addEventListener('click', () => {
      if (!isRunning) {
        // [시작]
        isRunning = true;
        startTime = Date.now() - elapsedTime;

        // 처음 시작할 때만 랩 1 생성
        if (lapCount === 0) {
          lapCount = 1;
          activeLapTimeSpan = createLapElement(lapCount, "00:00.00");
        }

        timerInterval = setInterval(() => {
          elapsedTime = Date.now() - startTime;
          
          // 1. 메인 큰 글씨 시간 업데이트
          display.textContent = formatDisplay(elapsedTime);
          
          // 2. 현재 돌아가고 있는 랩 시간 업데이트 (전체 시간 - 이전 랩 누적 시간)
          if (activeLapTimeSpan) {
            activeLapTimeSpan.textContent = formatDisplay(elapsedTime - lastLapSplitTime);
          }
        }, 10);

        startStopBtn.textContent = '중단';
        startStopBtn.className = 'circle-btn btn-stop';
        lapResetBtn.textContent = '랩';
        lapResetBtn.className = 'circle-btn btn-lap active';
     } else {
        // [중단]
        isRunning = false;
        clearInterval(timerInterval);
        elapsedTime = Date.now() - startTime;

        // ★ 사이클 반복 마술 로직 (예: 3, 6, 9번째 계속 발동) ★
        if (stopCount >= forceDelay) {
          // 1. 설정한 횟수(타이밍)에 도달하면 포스 숫자 보여줌
          display.textContent = formatDisplay(elapsedTime, forceHundredths);
          
          // 2. 포스가 발동되었으므로 다음 사이클(예: 다음 3번째)을 위해 횟수를 다시 0으로 초기화
          stopCount = 0; 
        } else {
          // 1. 아직 타이밍이 안 됐다면 진짜 멈춘 시간을 보여줌
          display.textContent = formatDisplay(elapsedTime);
          
          // 2. 포스가 발동하지 않았을 때만 카운트를 1 올림
          stopCount++; 
        }

        // 중단 시점의 랩 시간도 최종 업데이트
        if (activeLapTimeSpan) {
          activeLapTimeSpan.textContent = formatDisplay(elapsedTime - lastLapSplitTime);
        }

        startStopBtn.textContent = '시작';
        startStopBtn.className = 'circle-btn btn-start';
        lapResetBtn.textContent = '재설정';
        lapResetBtn.className = 'circle-btn btn-lap active';
      }
    });

    // 랩 / 재설정 버튼
    lapResetBtn.addEventListener('click', () => {
      if (isRunning) {
        // [랩 기록하기]
        // 1. 현재까지의 전체 시간을 기준으로 삼음 (이후 랩들의 0초 시작점)
        lastLapSplitTime = elapsedTime;
        
        // 2. 랩 번호 올리기
        lapCount++;
        
        // 3. 새 랩을 맨 위에 만들고, 지금부터 돌아갈 랩으로 연결
        activeLapTimeSpan = createLapElement(lapCount, "00:00.00");

      } else if (!isRunning && elapsedTime > 0) {
        // [재설정하기]
        elapsedTime = 0;
        display.textContent = "00:00.00";
        
        lapResetBtn.textContent = '랩';
        lapResetBtn.className = 'circle-btn btn-lap';
        
        // 랩 관련 모든 화면과 변수 초기화
        lapListArea.innerHTML = '';
        lapCount = 0;
        lastLapSplitTime = 0;
        activeLapTimeSpan = null;
      }
    });

    // --- 트릭 핫스팟 제어 ---
    // 1. 세계 시계 핫스팟 더블 탭 -> 비밀 탭 오픈
    let lastWorldClockTap = 0;
    document.getElementById('hotspot-worldclock').addEventListener('click', () => {
      const now = Date.now();
      if (now - lastWorldClockTap < 350) {
        secretView.style.display = 'flex';
      }
      lastWorldClockTap = now;
    });

    // --- 비밀 키패드 로직 ---
// --- 비밀 키패드 로직 ---
    
    // 칸 선택 시 테두리 색상 바꾸기
    function setActiveInput(type) {
      currentActiveInput = type;
      if (type === 'target') {
        targetInput.classList.add('active-input');
        delayInput.classList.remove('active-input');
      } else {
        delayInput.classList.add('active-input');
        targetInput.classList.remove('active-input');
      }
    }

    // 숫자 버튼 눌렀을 때 선택된 칸에 쓰기
    function inputKey(num) {
      let activeEl = currentActiveInput === 'target' ? targetInput : delayInput;
      let cur = activeEl.value;
      if (cur.length >= 2) cur = ""; 
      cur += num;
      activeEl.value = cur;
    }

    // C(지우기) 버튼 눌렀을 때 선택된 칸 지우기
    function clearKey() {
      let activeEl = currentActiveInput === 'target' ? targetInput : delayInput;
      activeEl.value = "";
    }

    // 완료 버튼 눌렀을 때 2개의 값 모두 저장하기
    function confirmSecret() {
      // 1. 위 칸(포스 숫자) 검사 및 저장
      let val = targetInput.value;
      if (val.length === 1) val = "0" + val;
      if (val.length === 0) val = "24";
      forceHundredths = val;
      localStorage.setItem('force_target', forceHundredths);

      // 2. 아래 칸(몇 번째에 포스할지) 검사 및 저장
      let dVal = delayInput.value;
      if (dVal.length === 0) dVal = "0";
      forceDelay = parseInt(dVal, 10);
      localStorage.setItem('force_delay', forceDelay);

      stopCount = 0;

      secretView.style.display = 'none';
    }
  </script>
</body>
</html>
