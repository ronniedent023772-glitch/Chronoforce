<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>스톱워치</title>

  <!-- iOS 웹앱 전체화면 설정 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="스톱워치">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      height: 100vh;
      height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      overflow: hidden;
    }

    /* 1. 상단 시간 표시 영역 */
    .stopwatch-display {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 5.5rem;
      font-weight: 200;
      letter-spacing: -1px;
      font-variant-numeric: tabular-nums; /* 숫자 폭 균일화 */
      margin-top: 11vh;
    }

    /* 2. 조작 버튼 및 인디케이터 영역 */
    .controls-section {
      width: 100%;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .btn-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 10px;
      margin-top: 40px;
    }

    .circle-btn {
      width: 85px;
      height: 85px;
      border-radius: 50%;
      border: 2px solid transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.05rem;
      font-weight: 400;
      cursor: pointer;
      position: relative;
    }

    /* 랩 / 재설정 버튼 */
    .btn-lap {
      background-color: #1c1c1e;
      color: #8e8e93;
    }
    .btn-lap.active {
      color: #ffffff;
    }

    /* 시작 / 중단 버튼 */
    .btn-start {
      background-color: #082a11;
      color: #34c759;
    }
    .btn-stop {
      background-color: #330e0e;
      color: #ff453a;
    }

    /* 페이지 인디케이터 점 */
    .pagination-dots {
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: center;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: #8f8f96;
    }
    .dot.active {
      background-color: #ffffff;
    }

    .divider {
      height: 0.5px;
      background-color: #2c2c2e;
      width: 100%;
      margin-top: 12px;
    }

    /* 빈 리스트 공간 */
    .lap-list-area {
      flex: 1.2;
      width: 100%;
    }

/* 3. 하단 네비게이션 탭 (추후 이미지로 대체 가능한 영역) */
    .tab-bar-container {
      width: 100%;
      height: 70px;
      
      /* ★ 위치 조절을 위한 설정 추가 ★ */
      position: fixed; 
      bottom: 0; /* 화면 맨 밑바닥에 딱 붙게 합니다 */
      /* bottom: 20px; 와 같이 숫자를 입력해 바닥에서 위로 띄울 수도 있습니다. */
      
      display: flex;
      justify-content: space-around;
      align-items: center;
      background-color: #000000;
    }

    .tab-item {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #8e8e93;
      font-size: 0.65rem;
      gap: 4px;
      pointer-events: none; /* 실제 탭 터치는 투명 핫스팟이 처리 */
    }

    .tab-item.active {
      color: #ff9f0a;
    }

    .tab-icon {
      font-size: 1.3rem;
    }

    /* 비밀 트리거용 투명 버튼 (핫스팟) */
    /* 비밀 트리거용 버튼 (핫스팟) - 위치 확인을 위해 임시로 보이게 설정 */
    .invisible-hotspot {
      position: absolute;
      bottom: 0; /* 화면 맨 밑에 딱 붙게 설정 */
      width: 25%;
      height: 70px; /* ★ 여기서 숫자를 늘리거나 줄여서 버튼의 높이를 조절하세요! (예: 50px, 100px) ★ */
      z-index: 50;
      background: rgba(255, 0, 0, 0.3); /* 반투명 빨간색 */
      border: 2px dashed red; /* 점선 테두리 */
    }
    #hotspot-worldclock { left: 0; }     /* 세계 시계 위치 */
    /* 스톱워치 위치 코드는 삭제했습니다 */

    /* 4. 마술사 전용 비밀 설정 화면 */
    #secret-view {
      display: none;
      position: fixed;
      inset: 0;
      background-color: #121214;
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .secret-title {
      font-size: 1.1rem;
      color: #8e8e93;
      margin-bottom: 20px;
    }

    .secret-input-box {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 2rem;
      margin-bottom: 30px;
    }

    .secret-input {
      width: 90px;
      height: 60px;
      background: #242426;
      border: 1px solid #ff9f0a;
      border-radius: 12px;
      color: #fff;
      font-size: 2.2rem;
      text-align: center;
      outline: none;
      font-variant-numeric: tabular-nums;
    }

    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      width: 260px;
    }

    .key-btn {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      background: #2c2c2e;
      color: #fff;
      font-size: 1.8rem;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }
    .key-btn:active {
      background: #48484a;
    }
  </style>
</head>
<body>

  <!-- 스톱워치 메인 화면 -->
  <div class="stopwatch-display" id="time-display">00:00.00</div>

  <div class="controls-section">
    <div class="btn-row">
      <div class="circle-btn btn-lap" id="lap-reset-btn">랩</div>
      <div class="pagination-dots">
        <span class="dot active"></span>
        <span class="dot"></span>
      </div>
      <div class="circle-btn btn-start" id="start-stop-btn">시작</div>
    </div>
    <div class="divider"></div>
  </div>

  <div class="lap-list-area"></div>

  <!-- 하단 네비게이션 탭 -->
  <!-- 하단 네비게이션 영역 (이미지 삽입을 위한 빈 공간 및 트릭 버튼) -->
  <div class="tab-bar-container">
    <!-- 세계 시계 위치 (트릭: 더블탭 시 비밀창) -->
    <div class="invisible-hotspot" id="hotspot-worldclock"></div>
  </div>

  <!-- 비밀 설정 화면 -->
  <div id="secret-view">
    <div class="secret-title">강제 소숫점 값 설정 (.00 ~ .99)</div>
    <div class="secret-input-box">
      <span>.</span>
      <input type="text" id="target-number-input" class="secret-input" readonly value="24">
    </div>

    <!-- 간편 키패드 -->
    <div class="keypad-grid">
      <div class="key-btn" onclick="inputKey('1')">1</div>
      <div class="key-btn" onclick="inputKey('2')">2</div>
      <div class="key-btn" onclick="inputKey('3')">3</div>
      <div class="key-btn" onclick="inputKey('4')">4</div>
      <div class="key-btn" onclick="inputKey('5')">5</div>
      <div class="key-btn" onclick="inputKey('6')">6</div>
      <div class="key-btn" onclick="inputKey('7')">7</div>
      <div class="key-btn" onclick="inputKey('8')">8</div>
      <div class="key-btn" onclick="inputKey('9')">9</div>
      <div class="key-btn" onclick="clearKey()">C</div>
      <div class="key-btn" onclick="inputKey('0')">0</div>
      <div class="key-btn" onclick="confirmSecret()" style="background:#ff9f0a; color:#000; font-size:1.1rem; font-weight:600;">완료</div>
    </div>
  </div>

  <script>
    // --- 상태 변수 ---
    let isRunning = false;
    let startTime = 0;
    let elapsedTime = 0;
    let timerInterval = null;

    // 기본 강제 숫자 (저장된 값이 있으면 불러옴)
    let forceHundredths = localStorage.getItem('force_target') || "24";

    // DOM 참조
    const display = document.getElementById('time-display');
    const startStopBtn = document.getElementById('start-stop-btn');
    const lapResetBtn = document.getElementById('lap-reset-btn');
    const secretView = document.getElementById('secret-view');
    const targetInput = document.getElementById('target-number-input');

    targetInput.value = forceHundredths;

    // --- 스톱워치 표시 포맷팅 ---
    function formatDisplay(ms, forcedHundredths = null) {
      const totalSeconds = Math.floor(ms / 1000);
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;

      // 소숫점 두 자리: 강제값이 있으면 강제값을 쓰고, 동작 중일 땐 실제 밀리초 계산
      let hundredths = forcedHundredths !== null 
        ? forcedHundredths 
        : String(Math.floor((ms % 1000) / 10)).padStart(2, '0');

      const mStr = String(minutes).padStart(2, '0');
      const sStr = String(seconds).padStart(2, '0');

      return `${mStr}:${sStr}.${hundredths}`;
    }

    // --- 스톱워치 메인 로직 ---
    startStopBtn.addEventListener('click', () => {
      if (!isRunning) {
        // [시작]
        isRunning = true;
        startTime = Date.now() - elapsedTime;
        timerInterval = setInterval(() => {
          elapsedTime = Date.now() - startTime;
          display.textContent = formatDisplay(elapsedTime);
        }, 10);

        // 버튼 스타일 전환
        startStopBtn.textContent = '중단';
        startStopBtn.className = 'circle-btn btn-stop';
        lapResetBtn.textContent = '랩';
        lapResetBtn.className = 'circle-btn btn-lap active';
      } else {
        // [중단] - 마술의 핵심 로직: 무조건 지정한 소숫점으로 강제 고정
        isRunning = false;
        clearInterval(timerInterval);
        elapsedTime = Date.now() - startTime;

        // 관객에게 보이는 최종 시간 표시에 포스 숫자 적용
        display.textContent = formatDisplay(elapsedTime, forceHundredths);

        // 버튼 스타일 전환
        startStopBtn.textContent = '시작';
        startStopBtn.className = 'circle-btn btn-start';
        lapResetBtn.textContent = '재설정';
        lapResetBtn.className = 'circle-btn btn-lap active';
      }
    });

    // 랩 / 재설정 버튼
    lapResetBtn.addEventListener('click', () => {
      if (!isRunning && elapsedTime > 0) {
        // 재설정
        elapsedTime = 0;
        display.textContent = "00:00.00";
        lapResetBtn.textContent = '랩';
        lapResetBtn.className = 'circle-btn btn-lap';
      }
    });

    // --- 트릭 핫스팟 제어 ---

    // 1. 세계 시계 더블 탭 -> 비밀 탭 오픈
    let lastWorldClockTap = 0;
    document.getElementById('hotspot-worldclock').addEventListener('click', () => {
      const now = Date.now();
      if (now - lastWorldClockTap < 350) {
        secretView.style.display = 'flex';
      }
      lastWorldClockTap = now;
    });

    // --- 비밀 키패드 로직 ---
    function inputKey(num) {
      let cur = targetInput.value;
      if (cur.length >= 2) cur = ""; // 2자리 이상 입력 시 리셋 후 새로 입력
      cur += num;
      targetInput.value = cur.slice(0, 2);
    }

    function clearKey() {
      targetInput.value = "";
    }

    function confirmSecret() {
      let val = targetInput.value;
      if (val.length === 1) val = "0" + val;
      if (val.length === 0) val = "24";

      forceHundredths = val;
      localStorage.setItem('force_target', forceHundredths);
      secretView.style.display = 'none';
    }
  </script>
</body>
</html>
